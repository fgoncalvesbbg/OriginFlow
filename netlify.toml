[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

[dev]
  command = "npm run start"
  targetPort = 5173
  framework = "#custom"

# Security response headers for every path. CSP is shipped as Report-Only (see below) rather
# than enforcing: index.html loads Tailwind's play CDN (https://cdn.tailwindcss.com), which
# needs 'unsafe-eval' (its runtime JIT compiler) and 'unsafe-inline' (the inline
# `tailwind.config = {...}` script, plus the <style> tags it injects at runtime) to render at
# all — a CSP loose enough to allow that provides little real script-injection protection, and
# getting it wrong would take the whole app down. Report-Only lets violations be observed
# (via the browser console / a report-to endpoint, once one exists) with zero risk of breaking
# the app, so the policy below can be tightened with evidence before it is ever enforced. It
# becomes enforcing (rename to Content-Security-Policy) once Tailwind is compiled locally at
# build time instead of pulled from the CDN, removing the unsafe-eval/unsafe-inline need for
# script-src (style-src will still need 'unsafe-inline' for inline utility styles unless a
# nonce/hash pipeline is added).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Origins referenced, verified by grepping index.html and src/config for every external
    # fetch/asset the app makes from the BROWSER (server-side-only calls — PDFShift, Jira,
    # regulatory-check's own Anthropic call — are made from netlify/functions or
    # supabase/functions and are not subject to the page's CSP, so they are deliberately not
    # listed here):
    #   - https://cdn.tailwindcss.com        index.html:15, the Tailwind play CDN <script>
    #   - https://fonts.googleapis.com       index.html:12,14, Inter stylesheet; also the
    #     Open Sans stylesheet imported by src/styles/klarstein-brand.css
    #   - https://fonts.gstatic.com          index.html:13, the font files that stylesheet pulls
    #   - https://ecueltibpmpnhnaxlskx.supabase.co / wss://...   src/config/im.constants.ts:20
    #     (public storage asset) and the live REST/Realtime/Edge-Function connection built from
    #     VITE_SUPABASE_URL (src/config/environment.config.ts, src/data/supabase/client.ts) —
    #     update this if the project's Supabase URL ever changes
    #   - https://res.cloudinary.com         SKU thumbnails (src/pages/products/SkuCatalog.tsx),
    #     IM brand logos (src/config/im.constants.ts) and the Klarstein wordmark on the
    #     supplier portals (src/components/portal/KlarsteinBrand.tsx). It is also in font-src:
    #     BwKlarstein, Klarstein's proprietary display face, is served from the same account
    #     (@font-face in src/styles/klarstein-brand.css) — there is no Google-hosted copy.
    #   - https://producttoolkit.chal-tec.local   ProductToolkit is called directly by the
    #     browser, not proxied (see the [functions] comment below) — VITE_PRODUCTTOOLKIT_URL
    #     overrides it for local dev, which this CSP does not need to cover
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://res.cloudinary.com data:; img-src 'self' data: https://res.cloudinary.com https://ecueltibpmpnhnaxlskx.supabase.co; connect-src 'self' https://ecueltibpmpnhnaxlskx.supabase.co wss://ecueltibpmpnhnaxlskx.supabase.co https://producttoolkit.chal-tec.local; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Server-side functions (PDF render, supplier file signed-URL issuer, IM
# translation proxy, Markup.io review upload, Jira project lookup).
# NOTE: the AI regulatory check is deliberately NOT here — it lives in
# supabase/functions/regulatory-check because one claude-opus-5 call over a regulation
# summary cannot finish inside the synchronous limit these functions run under (10s by
# default, ~26s at best; see functions/lib/print-render-shared.ts). Moving it back would
# reintroduce that timeout. These read secrets from the
# Netlify site environment (server-only — do NOT use a VITE_ prefix):
#   SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY  — storage + data access
#   ANTHROPIC_API_KEY                          — translate.ts (IM AI translation)
#   MARKUPIO_API_KEY                           — send-to-markup.ts (workspace API key)
#   MARKUPIO_FOLDER_ID                         — send-to-markup.ts (optional target folder)
#   JIRA_BASE_URL / JIRA_EMAIL / JIRA_API_TOKEN — jira-status.ts (live project lookup)
#   JIRA_PROJECT_KEY                           — jira-status.ts (optional; scopes the search)
#   JIRA_PROJECT_ID_FIELD                      — jira-status.ts (optional; display name of the
#                                                Jira field holding the launch code, default "ProjectID")
#   EPREL_API_KEY                              — eprel-lookup.ts (EU product registry cross-check)
#   EPREL_API_BASE                             — eprel-lookup.ts (optional; default
#                                                https://eprel.ec.europa.eu/api)
#   EPREL_PRODUCT_PATH                         — eprel-lookup.ts (optional; default
#                                                "/product/{registration}")
#   EPREL_API_KEY_HEADER                       — eprel-lookup.ts (optional; default "x-api-key")
# The matching public UI flag is VITE_MARKUP_REVIEW_ENABLED=true.
#
# The Jira connector needs NO public flag: jira-status.ts answers { configured: false }
# when its three secrets are unset, and the UI hides the Jira column on that. Nothing it
# reads is stored — every page load and every Refresh re-reads Jira, so the status shown
# is always live. Set the same vars in the repo-root .env for `netlify dev`.
#
# A launch is one EPIC in project PL whose "ProjectID" field (customfield_10260 on
# go-bbg, resolved by NAME at runtime) holds the OriginFlow project code; that Epic's
# status is the launch stage. The ~10-17 gate sub-tickets sharing a ProjectID are
# excluded. Diagnose with `npm run jira:check <CODE>`; assert against live Jira with
# `JIRA_LIVE_TEST=1 npx vitest run netlify/functions/lib/jira-match.live.test.ts`.
#
# The EPREL connector follows the Jira pattern: eprel-lookup.ts answers { configured: false }
# with HTTP 200 when EPREL_API_KEY is unset, and the Attribute Viewer hides the registry column
# on that rather than showing an error on every page load. Nothing it reads is stored.
#
# TWO PIECES OF ITS CONTRACT ARE UNVERIFIED, hence the two optional overrides above. The public
# API's base (https://eprel.ec.europa.eu/api), its JSON responses and its registration-number
# keying are documented publicly, but the exact product path and the API-key header name live in
# the EPREL wiki behind EU Login. Both are env templates so a correction is a deploy variable
# rather than a release. Request a key at https://eprel.ec.europa.eu/screen/requestpublicapikey,
# then POST { "probe": true } to the function: it echoes the exact URL and header name it would
# use (never the key) so they can be checked against the wiki.
#
# Note that only VERIFIED models are retrievable from the public API — an unverified
# registration answers as absent, which the function reports as "not-found" rather than as an
# error.
#
# ProductToolkit (category attribute definitions) is deliberately NOT proxied through a
# function: it is published only as https://producttoolkit.chal-tec.local on the internal
# network, which these cloud-run functions cannot resolve. The browser calls it directly,
# so it works only while the operator is on the VPN. Override the host with the public
# build var VITE_PRODUCTTOOLKIT_URL (e.g. http://localhost:8787/apps/attribute-viewer).
# Every top-level file in this directory becomes a deployed function named after the file,
# and Netlify rejects a function name containing anything but alphanumerics, hyphens and
# underscores. A `foo.test.ts` sitting here therefore FAILS THE DEPLOY ("change the function
# names to contain only alphanumeric characters, hyphens or underscores"). Tests go in a
# SUBDIRECTORY instead — `lib/` for helper tests, `__tests__/` for tests of the top-level
# handlers: a subdirectory is only picked up as a function when it contains a matching
# `<dir>.ts` or `index.ts`, which neither does. vite.config.ts still collects them all
# (test.include covers `netlify/**/*.test.ts`).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Outbound SKU read API for ProductToolkit / Akeneo-code consumers. A friendly path in front
# of the function; the handler also accepts ?sku= directly. Requires SKU_API_TOKEN (server
# env, no VITE_ prefix) — the function refuses every request when it is unset, because this
# host is on the public internet and serves unreleased product data.
[[redirects]]
  from = "/api/skus/*"
  to = "/.netlify/functions/sku-attributes/:splat"
  status = 200

# ---------------------------------------------------------------------------
# SOP & Documents (migration 159). Three functions, four friendly paths.
#
# Every doc_* table is RLS default-deny with the PostgREST grants revoked, so these
# functions are the ONLY way to reach the registry — there is no client-side Supabase
# query against doc_* anywhere in src/. They read SUPABASE_URL and
# SUPABASE_SERVICE_ROLE_KEY from the server environment (already provisioned for the
# render/signed-URL functions above); no new secret is needed.
#
# Order matters: Netlify matches these top-down, so /api/documents/:id/latest has to come
# before any broader /api/documents rule would. There is deliberately no broad rule — the
# registry lives under /api/doc/* precisely so that the two public-ish download paths are
# the only things matching /api/documents and /api/doc-versions.
# ---------------------------------------------------------------------------

# The download route. GET only; authenticates, entitlement-checks, then 302s to a 120s
# signed URL. Never returns a storage path.
[[redirects]]
  from = "/api/doc-versions/:versionId/download"
  to = "/.netlify/functions/doc-download/versions/:versionId/download"
  status = 200

# The stable "latest template" route: names a DOCUMENT, resolves to whatever is final when
# it is clicked. Safe to paste into a wiki; 404s rather than serving a withdrawn version.
[[redirects]]
  from = "/api/documents/:documentId/latest"
  to = "/.netlify/functions/doc-download/documents/:documentId/latest"
  status = 200

# The project-scoped list behind the Documents tab — supplier portal and ProjectDetail
# alike. The only list route a portal token can reach.
[[redirects]]
  from = "/api/doc-portal/*"
  to = "/.netlify/functions/doc-portal/:splat"
  status = 200

# The internal registry API (documents, versions, finalise, bindings). Requires an
# authenticated internal user; no portal-token path into it at all.
[[redirects]]
  from = "/api/doc/*"
  to = "/.netlify/functions/doc-registry/:splat"
  status = 200
