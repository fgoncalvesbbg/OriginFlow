
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OriginFlow PLM</title>
    <meta name="theme-color" content="#1a1f35" />
    <!-- Favicon: the OriginFlow mark (see src/components/Logo.tsx) as an inline SVG. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233f5b73'/><path d='M11 16L22.5 10.5M11 16L22.5 21.5' stroke='white' stroke-width='2.2' stroke-linecap='round'/><circle cx='11' cy='16' r='3.3' fill='white'/><circle cx='22.5' cy='10.5' r='2.4' fill='white'/><circle cx='22.5' cy='21.5' r='2.4' fill='white'/></svg>" />
    <!-- Modern Font Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          extend: {
            // Tightened radius scale — crisper, more enterprise corners than the
            // Tailwind defaults. Merged via `extend`, so `full`/`none` (avatars,
            // badges, pills) keep their original values.
            borderRadius: {
              DEFAULT: '0.25rem', // 4px
              sm: '0.1875rem',    // 3px
              md: '0.3125rem',    // 5px
              lg: '0.375rem',     // 6px
              xl: '0.5rem',       // 8px
              '2xl': '0.75rem',   // 12px
            },
            colors: {
              // ── Brand colors are indirected through CSS variables ──────────────
              // Every value below is `rgb(var(--of-*, <today's channels>) / <alpha-value>)`.
              // With no variable set the fallback applies, so the internal app renders
              // byte-identically to before. Setting the variables on an ancestor re-tints
              // EVERY utility and variant derived from that color at once — `bg-indigo-600`,
              // `hover:bg-indigo-700`, `ring-indigo-500`, `bg-indigo-50/20`, `shadow-indigo-200`.
              // That is how the supplier-facing portals get Klarstein's palette without
              // touching a single utility class: see src/styles/klarstein-brand.css.
              //
              // Brand neutrals
              primary: 'rgb(var(--of-primary, 26 31 53) / <alpha-value>)',   // Control-Room Ink — sidebar bg + body text
              secondary: '#6b7280',      // Refined gray — secondary text
              muted: '#9ca3af',          // Soft gray — muted text / icons
              light: '#f9fafb',          // Canvas — app background
              surface: '#ffffff',        // Raised surfaces (cards, top bar, panels)
              border: '#e5e7eb',         // Hairline borders / dividers
              // Action accent — Steel Slate: a muted, corporate blue-gray (replaces the
              // saturated indigo for a calmer, more professional feel).
              accent: 'rgb(var(--of-accent, 63 91 115) / <alpha-value>)',            // Steel Slate — primary action / active / selection
              'accent-hover': 'rgb(var(--of-accent-hover, 50 74 94) / <alpha-value>)', // Steel Slate, deepened for hover
              // Semantic status (see DESIGN.md status vocabulary)
              success: '#047857',        // Progress Emerald
              warning: '#b45309',        // Pending Amber
              danger: '#be123c',         // Blocked Rose
              // Remap the indigo/blue Tailwind scales (used app-wide) onto the same
              // Steel Slate ramp so every existing `indigo-*` / `blue-*` class reads as
              // the professional accent rather than the old "AI" violet-blue.
              indigo: {
                50:  'rgb(var(--of-indigo-50,  243 246 248) / <alpha-value>)',
                100: 'rgb(var(--of-indigo-100, 227 234 239) / <alpha-value>)',
                200: 'rgb(var(--of-indigo-200, 199 212 221) / <alpha-value>)',
                300: 'rgb(var(--of-indigo-300, 160 180 194) / <alpha-value>)',
                400: 'rgb(var(--of-indigo-400, 115 144 163) / <alpha-value>)',
                500: 'rgb(var(--of-indigo-500,  82 112 136) / <alpha-value>)',
                600: 'rgb(var(--of-indigo-600,  63  91 115) / <alpha-value>)',
                700: 'rgb(var(--of-indigo-700,  52  73  93) / <alpha-value>)',
                800: 'rgb(var(--of-indigo-800,  45  62  78) / <alpha-value>)',
                900: 'rgb(var(--of-indigo-900,  40  53  67) / <alpha-value>)',
              },
              blue: {
                50:  'rgb(var(--of-blue-50,  243 246 248) / <alpha-value>)',
                100: 'rgb(var(--of-blue-100, 227 234 239) / <alpha-value>)',
                200: 'rgb(var(--of-blue-200, 199 212 221) / <alpha-value>)',
                300: 'rgb(var(--of-blue-300, 160 180 194) / <alpha-value>)',
                400: 'rgb(var(--of-blue-400, 115 144 163) / <alpha-value>)',
                500: 'rgb(var(--of-blue-500,  82 112 136) / <alpha-value>)',
                600: 'rgb(var(--of-blue-600,  63  91 115) / <alpha-value>)',
                700: 'rgb(var(--of-blue-700,  52  73  93) / <alpha-value>)',
                800: 'rgb(var(--of-blue-800,  45  62  78) / <alpha-value>)',
                900: 'rgb(var(--of-blue-900,  40  53  67) / <alpha-value>)',
              },
              // Violet keeps Tailwind's own values as its fallbacks — it is declared here
              // ONLY so the portal scope can re-point it. Nothing changes outside that scope.
              violet: {
                50:  'rgb(var(--of-violet-50,  245 243 255) / <alpha-value>)',
                100: 'rgb(var(--of-violet-100, 237 233 254) / <alpha-value>)',
                200: 'rgb(var(--of-violet-200, 221 214 254) / <alpha-value>)',
                300: 'rgb(var(--of-violet-300, 196 181 253) / <alpha-value>)',
                400: 'rgb(var(--of-violet-400, 167 139 250) / <alpha-value>)',
                500: 'rgb(var(--of-violet-500, 139  92 246) / <alpha-value>)',
                600: 'rgb(var(--of-violet-600, 124  58 237) / <alpha-value>)',
                700: 'rgb(var(--of-violet-700, 109  40 217) / <alpha-value>)',
                800: 'rgb(var(--of-violet-800,  91  33 182) / <alpha-value>)',
                900: 'rgb(var(--of-violet-900,  76  29 149) / <alpha-value>)',
              },
            }
          }
        }
      }
    </script>
</head>
  <body class="bg-light text-primary antialiased">
    <div id="root"></div>
    <!-- Load the main React entry point -->
    <script type="module" src="./src/app/main.tsx"></script>
  </body>
</html>
